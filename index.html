<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmarterMinds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#5B3A23; --maple:#F1E0C2; --paper:#FBF3E0; --plank:#E3BF8A; --plank-hi:#EDCFA0;
    --edge:#6B4423; --dark:#3E2514; --ink:#2B1A0E; --muted:#5C4330;
    --good:#2F6B2A; --good-soft:#D8E8C6; --bad-soft:#F2C4B8; --pencil:#1F4E79;
  }
  *{box-sizing:border-box}
  html{font-size:20px}
  body{margin:0;color:var(--ink);line-height:1.5;
    font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 29px),
      var(--wood)}
  main{max-width:640px;margin:24px auto;padding:24px 20px 36px;background:var(--maple);
    border:8px solid var(--dark);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  h1{font-size:2.1rem;margin:0 0 4px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  h2{font-size:1.5rem;margin:0 0 12px}
  p{margin:0 0 16px}
  .muted{color:var(--muted)}
  .meta{color:var(--muted);margin-bottom:8px}
  button{font:inherit;cursor:pointer;min-height:48px;min-width:48px}
  button:focus-visible{outline:4px solid #1F4E79;outline-offset:3px}
  .big{display:block;width:100%;min-height:76px;margin:0 0 14px;padding:14px 18px;
    font-size:1.6rem;font-weight:700;color:var(--ink);
    background:linear-gradient(var(--plank-hi),var(--plank));
    border:3px solid var(--edge);border-radius:14px;text-align:left;box-shadow:0 3px 0 var(--edge)}
  .big:hover:not(:disabled){background:var(--plank-hi)}
  .big small{display:block;font-size:1rem;font-weight:400;color:var(--muted)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opts .big{margin:0;text-align:center}
  .big.right{background:var(--good-soft);border-color:var(--good);box-shadow:none}
  .big:disabled{cursor:default;box-shadow:none}
  .primary{background:var(--edge);color:#FFF4DE;border:3px solid var(--dark);
    border-radius:14px;padding:14px 22px;font-weight:700;font-size:1.2rem;min-height:60px}
  .primary:hover{background:var(--dark)}
  .sec{min-height:56px;padding:10px 16px;font-size:1.1rem;font-weight:700;color:var(--ink);
    background:linear-gradient(var(--plank-hi),var(--plank));border:3px solid var(--edge);border-radius:12px}
  .sec:hover{background:var(--plank-hi)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .prompt{font-size:3rem;text-align:center;margin:24px 0 28px}
  .digits{font-size:3.6rem;font-weight:700;letter-spacing:.15em;text-align:center;
    background:var(--paper);border:3px solid var(--edge);border-radius:14px;padding:28px 8px;margin:16px 0 24px;word-break:break-all}
  .typed{min-height:92px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pad button{min-height:72px;font-size:1.7rem;font-weight:700;color:var(--ink);
    background:linear-gradient(var(--plank-hi),var(--plank));border:3px solid var(--edge);border-radius:14px}
  .pad button:hover:not(:disabled){background:var(--plank-hi)}
  .pad .go{background:var(--edge);color:#FFF4DE}
  #fb{min-height:3rem;margin-top:20px;font-size:1.2rem}
  #fb .next{display:block;margin-top:14px}
  .stat,.why{background:#E6CDA0;border:2px solid var(--edge);border-radius:14px;padding:14px 18px;margin:0 0 24px}
  .why{background:var(--paper);font-size:.95rem;margin:10px 0 8px}
  .link{background:none;border:none;color:var(--dark);text-decoration:underline;font-size:1.1rem;padding:12px 0}
  .grid{display:grid;border:4px solid var(--dark);border-radius:8px;overflow:hidden;background:var(--paper);
    margin:0 auto 16px;max-width:440px}
  .cell{aspect-ratio:1;min-height:0;padding:0;border:1px solid #B58B5C;border-radius:0;background:var(--paper);
    color:var(--pencil);font-weight:700;font-size:1.5rem}
  .n9 .cell{font-size:1.25rem}
  .cell.given{color:var(--ink);background:#EBD8B4}
  .cell.sel{background:#F6D36B}
  .cell.bad{background:var(--bad-soft)}
  .cell.br{border-right:3px solid var(--dark)}
  .cell.bb{border-bottom:3px solid var(--dark)}
  .snum{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:8px;margin-bottom:14px}
  .snum button{min-height:56px;font-size:1.5rem;font-weight:700;color:var(--ink);
    background:linear-gradient(var(--plank-hi),var(--plank));border:3px solid var(--edge);border-radius:12px}
  .wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:320px;margin:0 auto 14px}
  .wt{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;
    text-transform:uppercase;background:var(--paper);border:3px solid #B58B5C;border-radius:8px}
  .wt.g,.key.g{background:#3F7D32;color:#fff;border-color:#3F7D32}
  .wt.y,.key.y{background:#E0A82E;color:var(--ink);border-color:#E0A82E}
  .wt.x,.key.x{background:#7A6A5A;color:#fff;border-color:#7A6A5A}
  .kr{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
  .key{flex:1;max-width:46px;min-height:54px;padding:0;font-size:1rem;font-weight:700;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(var(--plank-hi),var(--plank));border:2px solid var(--edge);border-radius:8px}
  .key[data-k=ENTER],.key[data-k=DEL]{max-width:70px;font-size:.75rem}
  .xg{display:grid;gap:2px;margin:0 auto 16px;max-width:440px}
  .xc{position:relative;aspect-ratio:1;background:var(--paper);border:2px solid var(--edge);display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;color:var(--pencil)}
  .xc i{position:absolute;top:1px;left:3px;font-size:.6rem;font-style:normal;color:var(--muted)}
  .xb{aspect-ratio:1;background:var(--dark);border-radius:3px}
  .cl{display:block;margin:0 0 10px;font-size:1rem}
  .cl input{display:block;margin-top:4px;width:100%;font:inherit;font-size:1.2rem;letter-spacing:.25em;text-transform:uppercase;
    padding:8px 10px;border:3px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink)}
  .cl input.bad{background:var(--bad-soft)}
  .jg{display:grid;gap:3px;aspect-ratio:3/2;max-width:520px;margin:0 auto 14px;background:var(--dark);padding:3px;border-radius:8px}
  .jp{padding:0;min-height:0;border:3px solid transparent;border-radius:4px;background-repeat:no-repeat}
  .jp.ok{border-color:#3F7D32}
  .jp.sel{border-color:#F2B705;outline:3px solid #F2B705;z-index:1}
  html[data-theme="dark"]{--wood:#1F140C;--maple:#2E2118;--paper:#3B2C20;--plank:#6A4A2E;--plank-hi:#7B5836;
    --edge:#C9A06A;--dark:#120A05;--ink:#F6E9D2;--muted:#CDB89A;--pencil:#8EC5F0;--good-soft:#2F4A2A;--bad-soft:#6B2E24}
  html[data-theme="dark"] .primary,html[data-theme="dark"] .pad .go{background:#8A5A2B;color:#fff}
  html[data-theme="dark"] .cell.given{background:#4A3829}
  html[data-theme="dark"] .cell.sel{background:#8A6B1E}
  html[data-theme="dark"] .stat,html[data-theme="dark"] .why{background:#3B2C20}
  html[data-theme="dark"] .wt{border-color:#7A5A3A}
  html[data-font="small"]{font-size:16px}
  html[data-font="large"]{font-size:24px}
  .top{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  #brand{background:none;border:none;font-size:1.5rem;font-weight:700;color:var(--ink);padding:4px 0}
  #gear,#dash{min-height:48px;padding:6px 14px}
  .tb{display:flex;gap:8px}
  .pb{height:16px;background:var(--paper);border:2px solid var(--edge);border-radius:10px;overflow:hidden;margin:0 0 16px}
  .pb div{height:100%;background:#3F7D32;transition:width .3s}
  .gc{background:var(--paper);border:2px solid var(--edge);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .gc strong{font-size:1.3rem}
  .gc small{display:block;color:var(--muted);margin-bottom:10px}
  .row .sec{flex:1}
  .sec.last{border-color:var(--good)}
  .sec[aria-pressed="true"]{background:var(--edge);color:#FFF4DE}
  .tog{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .stat .n{font-size:3rem;font-weight:700;line-height:1}
  .primary+.sec{margin-left:10px}
  #leave{margin-top:14px}
  details{background:var(--paper);border:2px solid var(--edge);border-radius:12px;padding:8px 14px;margin-bottom:10px}
  summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
  .cell,.xc,.jp,.mc{min-width:0}
  .key{min-width:28px}
  .prompt.long{font-size:1.7rem;line-height:1.3}
  .mg{display:grid;gap:8px;max-width:320px;margin:0 auto 18px}
  .mc{aspect-ratio:1;min-height:64px;padding:0;border:3px solid var(--edge);border-radius:12px;background:var(--paper)}
  .mc.on{background:#F2B705;border-color:var(--dark)}
  .mc.right{outline:4px solid var(--good)}
  .nt{font-size:.5rem;line-height:1.1;font-weight:400;color:var(--muted);padding:1px;word-break:break-all}
  .xc{padding:0;border-radius:0;min-height:0;cursor:pointer}
  .xc.hl{background:#F6E3A1}
  .xc.cur{background:#F2B705;color:#2B1A0E}
  html[data-theme="dark"] .xc.hl{background:#6B5420}
  .cl.sel{outline:3px solid #F2B705;outline-offset:3px;border-radius:8px}
  .jp{position:relative}
  .jp.sel{transform:scale(.93);outline-width:4px}
  .jp.sel::after{content:"Selected";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#F2B705;color:#2B1A0E;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:6px}
  .src li{margin-bottom:8px}
  .src a{color:inherit}
  .foot{display:flex;flex-wrap:wrap;align-items:center;gap:0 16px}
  .fine{font-size:.72rem;color:var(--muted);flex:1 1 220px}
  @media (max-width:420px){html{font-size:18px}.prompt{font-size:2.4rem}.digits{font-size:2.8rem}main{margin:10px;padding:18px 14px 28px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header class="top"><button id="brand">SmarterMinds</button><span class="tb"><button class="sec" id="dash">Dashboard</button><button class="sec" id="gear" aria-label="Settings">⚙ Settings</button></span></header>
  <div id="view"></div>
</main>

<script>
/* ---------- Setup ---------- */
const ROUNDS = 5;        // questions per game
const MAX_LEVEL = 6;     // highest difficulty level
const view = document.querySelector('#view');
const $ = s => document.querySelector(s);

const GAMES = {
  math:    { title: 'Quick Math',           blurb: 'Solve a sum in your head.' },
  pattern: { title: 'Number Patterns',      blurb: 'Find the next number in the pattern.' },
  memory:  { title: 'Memory Challenge', blurb: 'Remember numbers and square positions.' },
  sudoku:  { title: 'Sudoku',               blurb: 'Fill the grid so no number repeats.' },
  wordle:    { title: 'Word Guess',  blurb: 'Guess the five-letter word. A new word every time.' },
  crossword: { title: 'Mini Crossword', blurb: 'Solve the clues to fill the grid.' },
  jigsaw:    { title: 'Jigsaw Puzzle', blurb: 'Swap pieces to rebuild the picture.' }
};

/* ---------- Saved progress (stays on this device's browser) ---------- */
function fresh(){ return { levels:{ math:1, pattern:1, memory:1, sudoku:1 }, days:[], diff:{}, set:{ mute:false, dark:false, font:'normal' } }; }
function load(){ try { return JSON.parse(localStorage.getItem('sharpminds')) || fresh(); } catch(e){ return fresh(); } }
function save(){ try { localStorage.setItem('sharpminds', JSON.stringify(S)); } catch(e){} }
let S = load();
S.levels.sudoku = S.levels.sudoku || 1;
S.levels.crossword = S.levels.crossword || 1;
S.levels.jigsaw = S.levels.jigsaw || 1;
S.diff = S.diff || {};
S.set = Object.assign({ mute:false, dark:false, font:'normal' }, S.set);   // for people who saved progress before Sudoku existed

/* ---------- Helpers ---------- */
const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=ri(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function options(ans){
  const set = new Set([ans]);
  const spread = Math.max(3, Math.round(Math.abs(ans)*0.15));
  while(set.size < 4){ const v = ans + ri(-spread, spread); if(v >= 0) set.add(v); }
  return shuffle([...set]);
}

/* ---------- Question makers: add new game types here ---------- */
function makeMath(l){
  let a,b,op;
  if(l===1){ a=ri(1,9); b=ri(1,9); op='+'; }
  else if(l===2){ if(Math.random()<.5){ a=ri(5,20); b=ri(5,20); op='+'; } else { a=ri(10,25); b=ri(1,9); op='−'; } }
  else if(l===3){ if(Math.random()<.5){ a=ri(15,60); b=ri(6,39); op='+'; } else { a=ri(30,80); b=ri(11,29); op='−'; } }
  else if(l===4){ a=ri(2,9); b=ri(2,9); op='×'; }
  else if(l===5){ if(Math.random()<.5){ a=ri(40,99); b=ri(21,89); op='+'; } else { a=ri(60,99); b=ri(21,59); op='−'; } }
  else { a=ri(6,12); b=ri(6,12); op='×'; }
  const ans = op==='+' ? a+b : op==='−' ? a-b : a*b;
  return mathVariant({ prompt:`${a} ${op} ${b} = ?`, ans, opts: options(ans), a, b, op }, l);
}

function mathVariant(q,l){
  const r = Math.random();
  if(l>=2 && r<.18){ const hi=l>=5?12:9, d=ri(2,hi), c=ri(2,hi); return { prompt:`${d*c} ÷ ${d} = ?`, ans:c, opts:options(c) }; }   // division
  if(r<.42) return { prompt:`${q.a} ${q.op} ? = ${q.ans}`, ans:q.b, opts:options(q.b) };                                              // missing number
  if(r<.58){                                                                                                                            // word problem
    const txt = q.op==='+' ? `You pick ${q.a} flowers, then ${q.b} more. How many in all?`
      : q.op==='−' ? `You have ${q.a} cookies and eat ${q.b}. How many are left?`
      : `There are ${q.a} boxes with ${q.b} pencils each. How many pencils?`;
    return { prompt:txt, ans:q.ans, opts:q.opts };
  }
  return q;
}
const fromSeq = t => ({ prompt: t.slice(0,-1).join(', ')+', ?', ans: t[t.length-1], opts: options(t[t.length-1]) });
function patternVariant(l){
  const r = Math.random();
  if(l>=3 && r<.3){ const t=[ri(1,3),ri(1,4)]; while(t.length<6) t.push(t[t.length-1]+t[t.length-2]); return fromSeq(t); }   // Fibonacci-style
  if(l>=4 && r<.55){ const a=ri(3,8), b=ri(1,a-1), t=[]; let v=ri(10,20); for(let i=0;i<6;i++){ t.push(v); v += i%2 ? -b : a; } return fromSeq(t); } // alternating up and down
  if(l>=5 && r<.75){ const d1=ri(2,5), d2=ri(3,9), x=ri(1,9), y=ri(20,40); return fromSeq([x,y,x+d1,y+d2,x+2*d1,y+2*d2]); }   // two patterns taking turns
  return null;
}
function makePattern(l){
  const v = patternVariant(l); if(v) return v;
  const s = [], st = ri(1,10);
  if(l===1){ const d=ri(1,5); for(let i=0;i<5;i++) s.push(st+d*i); }
  else if(l===2){ const d=ri(2,10), top=st+d*5; for(let i=0;i<5;i++) s.push(top-d*i); }
  else if(l===3){ const f=ri(1,5); for(let i=0;i<5;i++) s.push(f*2**i); }
  else if(l===4){ const a=ri(2,6), b=ri(1,4); let v=st; for(let i=0;i<6;i++){ s.push(v); v += i%2 ? b : a; } }
  else if(l===5){ let v=st, d=ri(1,3); for(let i=0;i<6;i++){ s.push(v); v+=d; d++; } }
  else { const n=ri(1,6); for(let i=0;i<5;i++) s.push((n+i)**2); }
  const ans = s[s.length-1];
  return { prompt: s.slice(0,-1).join(', ') + ', ?', ans, opts: options(ans) };
}

/* ---------- Helpers for difficulty, sound, streak, progress ---------- */
const LV = { math:{easy:[1,2],medium:[3,4],hard:[5,6]}, pattern:{easy:[1,2],medium:[3,4],hard:[5,6]}, memory:{easy:[1,2],medium:[3,4],hard:[5,6]},
  sudoku:{easy:[2,3],medium:[4,5],hard:[6]}, crossword:{easy:[1],medium:[3],hard:[5]}, jigsaw:{easy:[1,2],medium:[3,4],hard:[5,6]} };
const pickLevel = k => { const a = LV[k][S.diff[k] || 'easy']; return a[ri(0,a.length-1)]; };
const cap = t => t ? t[0].toUpperCase()+t.slice(1) : '';
const bar = f => `<div class="pb" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f*100)}"><div style="width:${f*100}%"></div></div>`;
function streak(){
  const set = new Set(S.days.map(d => new Date(d).toDateString()));
  const d = new Date(); if(!set.has(d.toDateString())) d.setDate(d.getDate()-1);
  let n = 0; while(set.has(d.toDateString())){ n++; d.setDate(d.getDate()-1); } return n;
}
function applySettings(){ document.documentElement.dataset.theme = S.set.dark ? 'dark' : 'light'; document.documentElement.dataset.font = S.set.font || 'normal'; }

let AC = null;
function tone(f,t0,d,v){ const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+t0;
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function sfx(kind){
  if(S.set.mute) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    if(kind==='win') [523,659,784,1047].forEach((f,i) => tone(f,i*.12,.3,.18)); else tone(700,0,.06,.12); } catch(e){}
}
document.addEventListener('click', e => { if(e.target.closest && e.target.closest('button')) sfx('click'); });
document.addEventListener('input', () => sfx('click'));

const SOURCES = [
 ['Wesnes KA, Brooker H, Ballard C, et al. (2019). An online investigation of the relationship between the frequency of word puzzle use and cognitive function in a large sample of older adults. International Journal of Geriatric Psychiatry.','https://doi.org/10.1002/gps.5033'],
 ['Brooker H, Wesnes KA, Ballard C, et al. (2019). The relationship between the frequency of number-puzzle use and baseline cognitive function in a large online sample of adults aged 50 and over. International Journal of Geriatric Psychiatry, 34(7), 932–940.','https://doi.org/10.1002/gps.5085'],
 ['University of Exeter (2019, May 16). Regular crosswords and number puzzles linked to sharper brain in later life. ScienceDaily.','https://www.sciencedaily.com/releases/2019/05/190516082349.htm'],
 ['NIHR Join Dementia Research. Can doing a daily crossword or sudoku puzzle keep your brain young? (a plain-language review of the two studies and their limits).','https://news.joindementiaresearch.nihr.ac.uk/can-doing-a-daily-crossword-or-sudoku-puzzle-keep-your-brain-young/']
];
const ABOUT = "SmarterMinds was created by a high school junior who loves math and coding. He built this site to help people keep their minds active as they age, and to support the fight against cognitive decline. Number puzzles, pattern games, memory challenges and word games all ask your brain to focus, remember and reason, and doing that regularly is a great habit. The games are simple, readable and free to play.";
const HOW = [
 ['Quick Math','Solve each sum in your head, then tap the right answer. Each round has 5 questions.'],
 ['Number Patterns','Work out the rule in the row of numbers, such as adding the same amount each time, then tap the number that comes next.'],
  ['Memory Challenge','You’ll get number rounds and picture rounds. For numbers, study the digits as long as you like, tap “I’ve got them”, then type them back on the keypad. For squares, remember which ones light up, then tap those squares. Tap Check when you’re done.'],
 ['Sudoku','Fill every row, column and boxed block with each number exactly once. Tap a square, then a number. Use Check to find mistakes, or Hint for help.'],
 ['Word Guess','Guess the hidden five-letter word in six tries. Every guess must be a real word. Green means the right letter in the right spot, yellow means the right letter in the wrong spot, and grey means it isn’t in the word.'],
 ['Mini Crossword','Read each clue and type the answer in its box. Answers share letters where they cross, so one answer can help with another.'],
 ['Jigsaw Puzzle','Tap one piece, then tap another to swap them. Pieces with a green edge are in the right place. The small picture is your guide.']
];

/* ---------- Home (welcome), Games menu, Settings ---------- */
let SCREEN = 'landing', BACKTO = landing;
function landing(){
  SCREEN = 'landing'; G = null; $('#dash').style.display = 'none';
  const n = streak(), today = S.days.includes(new Date().toDateString());
  view.innerHTML = `
    <h1>Ready to give your brain a workout?</h1>
    <div class="stat"><span class="n">${n}</span> day streak<br><small class="muted">${today ? 'You’ve played today. Great job!' : (n ? 'Finish a game today to keep your streak going.' : 'Finish a game today to start your streak.')}</small></div>
    <button class="primary" id="play" style="width:100%;font-size:1.5rem;min-height:72px">Play games</button>

/* ---------- Game flow ---------- */
let G = null;
function start(key){
  const go = { sudoku:startSudoku, wordle:startWordle, crossword:startCrossword, jigsaw:startJigsaw }[key];
  if(go) return go();
  G = { key, i:0, correct:0, run:0 };
  key === 'memory' ? showMemory() : showQuestion();
}

function showQuestion(){
  const maker = G.key === 'math' ? makeMath : makePattern;
  const q = maker(pickLevel(G.key));
  view.innerHTML = `
    <p class="meta">${GAMES[G.key].title} · Question ${G.i+1} of ${ROUNDS}</p>${bar(G.i/ROUNDS)}
    <h2 class="prompt${q.prompt.length>14?' long':''}">${q.prompt}</h2>
    <div class="opts">${q.opts.map(o => `<button class="big" data-v="${o}">${o}</button>`).join('')}</div>
    <div id="fb" role="status" aria-live="polite"></div>
    <button class="sec" id="leave">Leave this game</button>`;
  view.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    view.querySelectorAll('.opts button').forEach(x => { x.disabled = true; if(+x.dataset.v === q.ans) x.classList.add('right'); });
    afterAnswer(+b.dataset.v === q.ans, `The answer is ${q.ans}.`);
  });
}

function showMemory(){
  if(Math.random() < .5) return showGrid();
  const len = 2 + pickLevel('memory');
  G.seq = Array.from({length:len}, () => ri(0,9)).join('');
  view.innerHTML = `
    <p class="meta">${GAMES.memory.title} · Question ${G.i+1} of ${ROUNDS}</p>${bar(G.i/ROUNDS)}
    <p>Take your time. Remember these numbers.</p>
    <div class="digits" aria-label="Numbers to remember">${G.seq.split('').join(' ')}</div>
    <button class="primary" id="ready">I’ve got them</button>
    <button class="sec" id="leave">Leave this game</button>`;
  $('#ready').onclick = askMemory;
}

function askMemory(){
  let typed = '';
  view.innerHTML = `
    <p class="meta">${GAMES.memory.title} · Question ${G.i+1} of ${ROUNDS}</p>${bar(G.i/ROUNDS)}
    <p>Type the numbers you saw.</p>
    <div class="digits typed" id="typed" aria-live="polite"></div>
    <div class="pad" id="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="del">Delete</button><button data-k="0">0</button><button data-k="go" class="go">Check</button>
    </div>
    <div id="fb" role="status" aria-live="polite"></div>
    <button class="sec" id="leave">Leave this game</button>`;
  const show = () => $('#typed').textContent = typed.split('').join(' ') || '\u00A0';
  show();
  view.querySelectorAll('#pad button').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if(k === 'del') typed = typed.slice(0,-1);
    else if(k === 'go'){
      if(!typed) return;
      view.querySelectorAll('#pad button').forEach(x => x.disabled = true);
      afterAnswer(typed === G.seq, `The numbers were ${G.seq.split('').join(' ')}.`);
      return;
    }
    else if(typed.length < G.seq.length) typed += k;
    show();
  });
}


function gridHTML(size,on,live){
  return `<div class="mg" style="grid-template-columns:repeat(${size},1fr)">${[...Array(size*size)].map((_,i) => live
    ? `<button class="mc${on.has(i)?' on':''}" data-c="${i}" aria-label="Square ${i+1}" aria-pressed="${on.has(i)}"></button>`
    : `<div class="mc${on.has(i)?' on':''}"></div>`).join('')}</div>`;
}
function showGrid(){
  const cnt = 2 + pickLevel('memory'), size = cnt > 5 ? 4 : 3, cells = new Set();
  while(cells.size < cnt) cells.add(ri(0, size*size-1));
  G.grid = { size, cells, pick:new Set() };
  view.innerHTML = `<p class="meta">Memory Challenge · Question ${G.i+1} of ${ROUNDS}</p>${bar(G.i/ROUNDS)}
    <p>Remember which ${cnt} squares light up.</p>${gridHTML(size,cells,false)}
    <button class="primary" id="ready">I’ve got them</button>
    <button class="sec" id="leave">Leave this game</button>`;
  $('#ready').onclick = askGrid;
}
function askGrid(){
  const g = G.grid, paint = () => {
    view.innerHTML = `<p class="meta">Memory Challenge · Question ${G.i+1} of ${ROUNDS}</p>${bar(G.i/ROUNDS)}
      <p>Tap the ${g.cells.size} squares that lit up.</p>${gridHTML(g.size,g.pick,true)}
      <button class="primary" id="chkg">Check</button>
      <div id="fb" role="status" aria-live="polite"></div>
      <button class="sec" id="leave">Leave this game</button>`;
    view.querySelectorAll('.mc').forEach(b => b.onclick = () => { const c=+b.dataset.c; g.pick.has(c) ? g.pick.delete(c) : g.pick.add(c); paint(); });
    $('#chkg').onclick = () => {
      view.querySelectorAll('.mc').forEach(b => { b.disabled = true; if(g.cells.has(+b.dataset.c)) b.classList.add('right'); });
      $('#chkg').disabled = true;
      afterAnswer(g.pick.size===g.cells.size && [...g.pick].every(c => g.cells.has(c)), 'The squares that lit up have a green outline.');
    };
  };
  paint();
}
function afterAnswer(ok, detail){
  G.i++; if(ok) G.correct++;
  $('.pb div').style.width = (G.i/ROUNDS*100) + '%';
  const last = G.i >= ROUNDS;
  $('#fb').innerHTML = (ok ? '<strong>Correct.</strong> Well done.' : `<strong>Not quite.</strong> ${detail}`) +
    `<button class="primary next" id="next">${last ? 'See my results' : 'Next question'}</button>`;
  $('#next').onclick = last ? finish : (G.key === 'memory' ? showMemory : showQuestion);
  $('#next').focus();
}

function finish(){
  played(); sfx('win');
  const msg = G.correct >= 4 ? 'Excellent work.' : G.correct >= 2 ? 'Good effort. Every round keeps your mind active.' : 'Thanks for playing. The next round will adjust to suit you.';
  view.innerHTML = `
    <h2>You got ${G.correct} out of ${ROUNDS}</h2>
    <p>${msg}</p>
    <p class="muted">Difficulty: ${cap(S.diff[G.key])}. Streak: ${streak()} day${streak()===1?'':'s'}.</p>
    <button class="primary" id="again">Play again</button>
    <button class="sec" id="home">Back to games</button>`;
  $('#again').onclick = () => start(G.key);
  $('#home').onclick = home;
}

/* ---------- Sudoku (one puzzle per round; grows from 4x4 to 9x9) ---------- */
const SUDOKU_LEVELS = {
  1:{n:4,br:2,bc:2,blanks:6},  2:{n:4,br:2,bc:2,blanks:9},
  3:{n:6,br:2,bc:3,blanks:14}, 4:{n:6,br:2,bc:3,blanks:20},
  5:{n:9,br:3,bc:3,blanks:34}, 6:{n:9,br:3,bc:3,blanks:44}
};

function sdOk(g,n,br,bc,r,c,v){
  for(let i=0;i<n;i++) if(g[r][i]===v || g[i][c]===v) return false;
  const r0=r-r%br, c0=c-c%bc;
  for(let i=0;i<br;i++) for(let j=0;j<bc;j++) if(g[r0+i][c0+j]===v) return false;
  return true;
}
/* Counts solutions (up to limit). With fill=true it leaves one random solution in the grid. */
function sdSolve(g,n,br,bc,limit,fill){
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    if(g[r][c]!==0) continue;
    let count=0, vals=[...Array(n)].map((_,i)=>i+1);
    if(fill) shuffle(vals);
    for(const v of vals){
      if(!sdOk(g,n,br,bc,r,c,v)) continue;
      g[r][c]=v;
      count += sdSolve(g,n,br,bc,limit-count,fill);
      if(fill && count>0) return count;
      g[r][c]=0;
      if(count>=limit) return count;
    }
    return count;
  }
  return 1;
}
function sdMake(l){
  const {n,br,bc,blanks} = SUDOKU_LEVELS[l];
  const sol = Array.from({length:n},()=>Array(n).fill(0));
  sdSolve(sol,n,br,bc,1,true);
  const p = sol.map(r=>r.slice());
  let removed = 0;
  for(const k of shuffle([...Array(n*n).keys()])){
    if(removed >= blanks) break;
    const r=Math.floor(k/n), c=k%n, keep=p[r][c];
    p[r][c]=0;
    if(sdSolve(p.map(x=>x.slice()),n,br,bc,2,false)===1) removed++; else p[r][c]=keep;
  }
  return { n,br,bc,sol, cur:p.map(r=>r.slice()), given:p.map(r=>r.map(v=>v!==0)) };
}

function sdClash(p,r,c){
  const v=p.cur[r][c], n=p.n;
  for(let i=0;i<n;i++) if((i!==c && p.cur[r][i]===v) || (i!==r && p.cur[i][c]===v)) return true;
  const r0=r-r%p.br, c0=c-c%p.bc;
  for(let i=0;i<p.br;i++) for(let j=0;j<p.bc;j++){ const rr=r0+i, cc=c0+j; if((rr!==r || cc!==c) && p.cur[rr][cc]===v) return true; }
  return false;
}
function startSudoku(){
  G = { key:'sudoku', hints:0, sel:null, bad:null, msg:'', notes:{}, notesOn:false, p:sdMake(pickLevel('sudoku')) };
  drawSudoku();
}
function drawSudoku(){
  const p=G.p, n=p.n, lvl=S.levels.sudoku;
  let cells='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const v=p.cur[r][c], cls=['cell'];
    if(p.given[r][c]) cls.push('given');
    if(G.sel && G.sel[0]===r && G.sel[1]===c) cls.push('sel');
    if((G.bad && G.bad.has(r*n+c)) || (v && !p.given[r][c] && sdClash(p,r,c))) cls.push('bad');
    if((c+1)%p.bc===0 && c<n-1) cls.push('br');
    if((r+1)%p.br===0 && r<n-1) cls.push('bb');
    cells += `<button class="${cls.join(' ')}" data-r="${r}" data-c="${c}" aria-label="Row ${r+1}, column ${c+1}, ${v||'empty'}">${v || (G.notes[r+','+c] ? `<span class="nt">${[...G.notes[r+','+c]].sort().join(' ')}</span>` : '')}</button>`;
  }
  view.innerHTML = `
    <p class="meta">Sudoku · ${cap(S.diff.sudoku)} · ${n}×${n} grid</p>${bar(p.cur.flat().filter(v=>v).length/(n*n))}
    <p>Tap a square, then tap a number. Each row, column and boxed block needs 1 to ${n} with no repeats.</p>
    <div class="grid n${n}" style="grid-template-columns:repeat(${n},1fr)">${cells}</div>
    <div class="snum">${[...Array(n)].map((_,i)=>`<button data-num="${i+1}">${i+1}</button>`).join('')}<button data-num="0">Erase</button></div>
    <div class="row"><button class="sec" id="nt" aria-pressed="${G.notesOn}">✎ Notes: ${G.notesOn?'On':'Off'}</button><button class="sec" id="chk">Check my work</button><button class="sec" id="hint">Give me a hint</button></div>
    <div id="fb" role="status" aria-live="polite">${G.msg}</div>
    <button class="sec" id="home">Leave this game</button>`;
  view.querySelectorAll('.cell').forEach(b => b.onclick = () => {
    const r=+b.dataset.r, c=+b.dataset.c;
    if(!p.given[r][c]){ G.sel=[r,c]; drawSudoku(); }
  });
  view.querySelectorAll('[data-num]').forEach(b => b.onclick = () => {
    if(!G.sel){ G.msg='Tap an empty square first.'; return drawSudoku(); }
    const [sr,sc]=G.sel, num=+b.dataset.num, key=sr+','+sc;
    if(G.notesOn && num && p.cur[sr][sc]===0){ const st=G.notes[key]=G.notes[key]||new Set(); st.has(num) ? st.delete(num) : st.add(num); G.msg=''; return drawSudoku(); }
    delete G.notes[key]; p.cur[sr][sc]=num; G.bad=null; G.msg='';
    if(p.cur.every(row => row.every(v => v!==0))){
      if(p.cur.every((row,r) => row.every((v,c) => v===p.sol[r][c]))) return sudokuWin();
      G.msg='Every square is filled, but a few are wrong. Tap “Check my work” to see which.';
    }
    drawSudoku();
  });
  $('#nt').onclick = () => { G.notesOn = !G.notesOn; G.msg = G.notesOn ? 'Notes are on. Tap a number to jot it down as a possibility.' : ''; drawSudoku(); };
  $('#chk').onclick = () => {
    G.bad = new Set();
    p.cur.forEach((row,r) => row.forEach((v,c) => { if(v && v!==p.sol[r][c]) G.bad.add(r*n+c); }));
    G.msg = G.bad.size ? `${G.bad.size} square${G.bad.size>1?'s need':' needs'} another look. They are shown in red.` : 'Everything filled in so far is correct. Keep going.';
    drawSudoku();
  };
  $('#hint').onclick = () => {
    let t = G.sel && !p.given[G.sel[0]][G.sel[1]] && p.cur[G.sel[0]][G.sel[1]] !== p.sol[G.sel[0]][G.sel[1]] ? G.sel : null;
    if(!t){ const open=[]; p.cur.forEach((row,r)=>row.forEach((v,c)=>{ if(v!==p.sol[r][c]) open.push([r,c]); })); t=open[ri(0,open.length-1)]; }
    p.cur[t[0]][t[1]] = p.sol[t[0]][t[1]]; p.given[t[0]][t[1]] = true;
    G.hints++; G.bad=null; G.sel=null; G.msg='I filled in one square for you.';
    if(p.cur.every((row,r) => row.every((v,c) => v===p.sol[r][c]))) return sudokuWin();
    drawSudoku();
  };
  $('#home').onclick = home;
}
function sudokuWin(){ winScreen('Puzzle solved!', G.hints ? `You used ${G.hints} hint${G.hints>1?'s':''}. Try one with none next time.` : 'Solved with no hints. Excellent!', ['Next puzzle',startSudoku]); }

const KROWS = ['qwertyuiop','asdfghjkl','>zxcvbnm<'];
function wScore(g,a){
  const r=Array(5).fill('x'), left={};
  for(let i=0;i<5;i++) if(g[i]===a[i]) r[i]='g'; else left[a[i]]=(left[a[i]]||0)+1;
  for(let i=0;i<5;i++) if(r[i]!=='g' && left[g[i]]>0){ r[i]='y'; left[g[i]]--; }
  return r;
}
function startWordle(){
  G = { key:'wordle', ans:WORDS[ri(0,WORDS.length-1)], rows:[], cur:'', done:false, msg:'Type a real five-letter word, then press Enter.' };
  drawWordle();
}
function drawWordle(){
  const best={}, rank={x:1,y:2,g:3};
  G.rows.forEach(([w,r]) => [...w].forEach((ch,i) => { if(!best[ch] || rank[r[i]]>rank[best[ch]]) best[ch]=r[i]; }));
  let grid='';
  for(let i=0;i<6;i++){ const row=G.rows[i];
    for(let j=0;j<5;j++) grid += `<div class="wt ${row?row[1][j]:''}">${row ? row[0][j] : (i===G.rows.length ? G.cur[j]||'' : '')}</div>`; }
  const keys = KROWS.map(r => `<div class="kr">${[...r].map(k => {
    const v = k==='>'?'ENTER':k==='<'?'DEL':k, lab = k==='>'?'Enter':k==='<'?'Delete':k;
    return `<button class="key ${best[k]||''}" data-k="${v}">${lab}</button>`; }).join('')}</div>`).join('');
  view.innerHTML = `
    <p class="meta">Word Guess · you have 6 guesses</p>${bar(G.rows.length/6)}
    <div class="wgrid">${grid}</div>
    <p id="fb" role="status" aria-live="polite">${G.msg}</p>
    ${G.done ? '<button class="primary" id="nw">New word</button>' : keys}
    <p class="muted" style="font-size:.85rem;margin-top:12px">Green: right letter, right spot. Yellow: right letter, wrong spot. Grey: not in the word. You can also type with your keyboard.</p>
    <button class="sec" id="leave">Leave this game</button>`;
  view.querySelectorAll('[data-k]').forEach(b => b.onclick = () => wkey(b.dataset.k));
  if(G.done) $('#nw').onclick = startWordle;
}
function wkey(k){
  if(!G || G.key!=='wordle' || G.done) return;
  if(k==='DEL') G.cur = G.cur.slice(0,-1);
  else if(k==='ENTER'){
    if(G.cur.length<5) G.msg='Please enter five letters.';
    else if(!VALID.has(G.cur)) G.msg='That doesn’t look like a real word. Please try another.';
    else {
      const won = G.cur===G.ans;
      G.rows.push([G.cur, wScore(G.cur,G.ans)]); G.cur='';
      if(won || G.rows.length===6){ G.done=true; played(); if(won) sfx('win');
        G.msg = won ? `You found it in ${G.rows.length} ${G.rows.length>1?'guesses':'guess'}. Well done!` : `Good try. The word was ${G.ans.toUpperCase()}.`; }
      else G.msg='Keep going.';
    }
  } else if(G.cur.length<5){ G.cur+=k; G.msg=''; }
  drawWordle();
}
document.addEventListener('keydown', e => {
  if(!G || G.key!=='wordle' || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key==='Enter'){ e.preventDefault(); wkey('ENTER'); }
  else if(e.key==='Backspace') wkey('DEL');
  else if(/^[a-z]$/i.test(e.key)) wkey(e.key.toLowerCase());
  if(/^([a-z]|Enter|Backspace)$/i.test(e.key)) sfx('click');
});

function cwMake(count){
  const N=25; let best=null;
  for(let attempt=0; attempt<60; attempt++){
    const pool = shuffle(CLUES.slice()).slice(0,count+7).sort((a,b)=>b[0].length-a[0].length);
    const g=Array.from({length:N},()=>Array(N).fill('')), f=Array.from({length:N},()=>Array(N).fill(0)), placed=[];
    const empty=(r,c)=>r<0||c<0||r>=N||c>=N||g[r][c]==='';
    const fits=(w,r,c,d)=>{
      const dr=d?1:0, dc=d?0:1, L=w.length;
      if(r+dr*(L-1)>=N || c+dc*(L-1)>=N || !empty(r-dr,c-dc) || !empty(r+dr*L,c+dc*L)) return -1;
      let cross=0;
      for(let i=0;i<L;i++){
        const rr=r+dr*i, cc=c+dc*i, ch=g[rr][cc];
        if(ch){ if(ch!==w[i] || (f[rr][cc]&(1<<d))) return -1; cross++; }
        else if(!empty(rr+dc,cc+dr) || !empty(rr-dc,cc-dr)) return -1;
      }
      return cross;
    };
    const put=(e,r,c,d)=>{ const [w,clue]=e; for(let i=0;i<w.length;i++){ const rr=r+(d?i:0), cc=c+(d?0:i); g[rr][cc]=w[i]; f[rr][cc]|=1<<d; } placed.push({w,clue,r,c,d}); };
    put(pool[0],12,12-Math.floor(pool[0][0].length/2),0);
    for(const e of pool.slice(1)){
      if(placed.length>=count) break;
      let done=false;
      for(const d of shuffle([0,1])){ for(let r=0;r<N&&!done;r++) for(let c=0;c<N&&!done;c++) if(fits(e[0],r,c,d)>0){ put(e,r,c,d); done=true; } if(done) break; }
    }
    const rs=placed.flatMap(w=>[w.r,w.r+(w.d?w.w.length-1:0)]), cs=placed.flatMap(w=>[w.c,w.c+(w.d?0:w.w.length-1)]);
    const size=Math.max(Math.max(...rs)-Math.min(...rs), Math.max(...cs)-Math.min(...cs))+1;
    const score=placed.length*100-size;
    if(!best || score>best.score){ best=placed; best.score=score; }
  }
  const r0=Math.min(...best.map(w=>w.r)), c0=Math.min(...best.map(w=>w.c));
  const r1=Math.max(...best.map(w=>w.r+(w.d?w.w.length-1:0))), c1=Math.max(...best.map(w=>w.c+(w.d?0:w.w.length-1)));
  const starts=[...new Set(best.map(w=>w.r+','+w.c))].sort((a,b)=>{const [ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc;});
  best.forEach(w=>w.num=starts.indexOf(w.r+','+w.c)+1);
  return { words:best, r0, c0, h:r1-r0+1, w:c1-c0+1 };
}

function drawCrossword(){
  const cw=G.cw; let cells='';
  for(let r=0;r<cw.h;r++) for(let c=0;c<cw.w;c++){
    const k=r+'_'+c;
    if(G.at[k]){ const st=cw.words.find(w=>w.r-cw.r0===r && w.c-cw.c0===c); cells+=`<button class="xc" id="x${k}" aria-label="Crossword square">${st?`<i>${st.num}</i>`:''}<b></b></button>`; }
    else cells+='<div class="xb"></div>';
  }
  const list = d => cw.words.map((w,i)=>({w,i})).filter(o=>o.w.d===d).sort((a,b)=>a.w.num-b.w.num)
    .map(({w,i}) => `<label class="cl" data-i="${i}"><strong>${w.num}.</strong> ${w.clue} (${w.w.length} letters)<input data-i="${i}" maxlength="${w.w.length}" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>`).join('');
  view.innerHTML = `
    <p class="meta">Mini Crossword · ${cap(S.diff.crossword)}</p>${bar(0)}
    <p>Tap a square to select a word (tap again to switch between across and down). Then type the answer in the highlighted clue box.</p>
    <p id="cwsel" role="status" aria-live="polite"><strong>Tap a square or a clue to pick a word.</strong></p>
    <div style="overflow-x:auto"><div class="xg" style="grid-template-columns:repeat(${cw.w},minmax(34px,1fr));min-width:${cw.w*34}px">${cells}</div></div>
    <h2>Across</h2>${list(0)}<h2>Down</h2>${list(1)}
    <div class="row"><button class="sec" id="chk">Check my work</button><button class="sec" id="hint">Give me a hint</button></div>
    <div id="fb" role="status" aria-live="polite"></div>
    <button class="sec" id="leave">Leave this game</button>`;
  view.querySelectorAll('.cl input').forEach(inp => inp.oninput = () => {
    inp.value = inp.value.replace(/[^a-z]/gi,'').toUpperCase(); inp.classList.remove('bad');
    G.ans[+inp.dataset.i] = inp.value; paintCw(); if(cwSolved()) cwWin();
  });
  view.querySelectorAll('.xc').forEach(c => c.onclick = () => {
    const k=c.id.slice(1), ws=G.at[k].map(a=>a[0]);
    cwSelect(ws.length>1 && ws.includes(G.sel) ? ws.find(x=>x!==G.sel) : ws[0], k); });
  view.querySelectorAll('.cl input').forEach(inp => inp.onfocus = () => { if(G.sel !== +inp.dataset.i) cwSelect(+inp.dataset.i, null, true); });
  $('#chk').onclick = () => {
    let bad=0;
    view.querySelectorAll('.cl input').forEach(inp => { const w=cw.words[+inp.dataset.i];
      const wrong = inp.value.length===w.w.length && inp.value!==w.w.toUpperCase(); inp.classList.toggle('bad',wrong); if(wrong) bad++; });
    $('#fb').textContent = bad ? `${bad} answer${bad>1?'s need':' needs'} another look. They are shaded red.` : 'Nothing wrong so far. Keep going.';
  };
  $('#hint').onclick = () => {
    const open = cw.words.map((w,i)=>i).filter(i => G.ans[i]!==cw.words[i].w.toUpperCase());
    const i = open[ri(0,open.length-1)];
    G.ans[i] = cw.words[i].w.toUpperCase(); G.hints++;
    const inp = view.querySelector(`input[data-i="${i}"]`); inp.value=G.ans[i]; inp.classList.remove('bad');
    paintCw(); $('#fb').textContent='I filled in one answer for you.'; if(cwSolved()) cwWin();
  };
}
function cwWin(){ winScreen('Crossword complete!', G.hints ? `You used ${G.hints} hint${G.hints>1?'s':''}. Try one with none next time.` : 'No hints needed. Excellent!', ['Next crossword',startCrossword]); }

`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='#bfe3f5'/><rect y='120' width='300' height='80' fill='#2f7fb0'/><path d='M150 30V118L90 118Z' fill='#fff7e6'/><path d='M158 52V118L215 118Z' fill='#e9573f'/><path d='M80 124H225L205 150H100Z' fill='#6b4423'/><circle cx='250' cy='38' r='20' fill='#ffd84a'/></svg>`,
`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='#8ecae6'/><path d='M0 150L80 50L140 130L200 40L300 150Z' fill='#6d7f99'/><path d='M80 50L105 85L85 78L65 88ZM200 40L228 82L205 74L180 86Z' fill='#fff'/><rect y='140' width='300' height='60' fill='#2a7ea6'/><path d='M0 150Q75 135 150 150T300 148V160H0Z' fill='#3e8a4a'/></svg>`,
`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='#1d2a4a'/><circle cx='230' cy='50' r='24' fill='#f5f0d0'/><g fill='#fff'><circle cx='40' cy='30' r='2'/><circle cx='90' cy='60' r='2'/><circle cx='140' cy='25' r='2'/><circle cx='180' cy='70' r='2'/><circle cx='60' cy='95' r='2'/><circle cx='270' cy='100' r='2'/></g><path d='M0 160Q80 120 150 155T300 140V200H0Z' fill='#14301f'/><rect x='60' y='140' width='30' height='30' fill='#6b4423'/><path d='M55 142L75 122L95 142Z' fill='#a33b2f'/><rect x='70' y='152' width='8' height='10' fill='#ffd84a'/></svg>`,
`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><rect width='300' height='200' fill='#cfe8ff'/><circle cx='80' cy='70' r='34' fill='#e0405a'/><circle cx='170' cy='55' r='30' fill='#f7b32b'/><circle cx='240' cy='90' r='26' fill='#3b7dd8'/><g stroke='#333' stroke-width='2'><path d='M60 100L70 128M100 100L90 128M155 82L162 106M185 82L178 106M228 112L234 130M252 112L246 130'/></g><g fill='#6b4423'><rect x='68' y='128' width='24' height='14'/><rect x='158' y='106' width='20' height='12'/><rect x='231' y='130' width='18' height='11'/></g><rect y='165' width='300' height='35' fill='#5fa04a'/></svg>`
];
function startJigsaw(){
  const [rows,cols]=JIG[pickLevel('jigsaw')], n=rows*cols; let order;
  do { order=shuffle([...Array(n).keys()]); } while(order.every((v,i)=>v===i));
  G={ key:'jigsaw', rows, cols, order, sel:null, uri:'data:image/svg+xml,'+encodeURIComponent(SCENES[ri(0,SCENES.length-1)]).replace(/'/g,'%27') };
  drawJigsaw();
}
function drawJigsaw(){
  const {rows,cols,order}=G;
  const tiles=order.map((p,pos)=>{ const x=p%cols, y=Math.floor(p/cols);
    return `<button class="jp${G.sel===pos?' sel':''}${p===pos?' ok':''}" data-pos="${pos}" aria-label="Piece ${pos+1}" style="background-image:url('${G.uri}');background-size:${cols*100}% ${rows*100}%;background-position:${cols>1?x*100/(cols-1):0}% ${rows>1?y*100/(rows-1):0}%"></button>`; }).join('');
  view.innerHTML = `
    <p class="meta">Jigsaw · ${cap(S.diff.jigsaw)} · ${rows*cols} pieces</p>${bar(order.filter((p,i)=>p===i).length/(rows*cols))}
    <p><strong>How it works:</strong> 1) Tap a piece to pick it up. 2) Tap a second piece to swap places. Pieces with a green edge are already correct.</p>
    <p id="jmsg" role="status" aria-live="polite"><strong>${G.sel===null ? 'No piece selected yet.' : `Piece ${G.sel+1} is selected (yellow, marked “Selected”). Tap another piece to swap, or tap it again to cancel.`}</strong></p>
    <img src="${G.uri}" alt="The finished picture" style="width:45%;max-width:220px;display:block;margin:0 auto 14px;border:3px solid var(--dark);border-radius:6px">
    <div class="jg" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${tiles}</div>
    <div class="row"></div>
    <button class="sec" id="leave">Leave this game</button>`;
  view.querySelectorAll('.jp').forEach(b => b.onclick = () => {
    const pos=+b.dataset.pos;
    if(G.sel===null) G.sel=pos;
    else if(G.sel===pos) G.sel=null;
    else { [order[G.sel],order[pos]]=[order[pos],order[G.sel]]; G.sel=null;
      if(order.every((v,i)=>v===i)) return jigWin(); }
    drawJigsaw();
  });
}
function jigWin(){ winScreen('Puzzle complete!', 'Lovely work.', ['Next puzzle',startJigsaw], `<img src="${G.uri}" alt="The finished picture" style="width:70%;display:block;margin:0 auto 14px;border:3px solid var(--dark);border-radius:6px">`); }

    n:"The study shows a link. It can’t prove puzzles are the cause." }
];
function pickQuote(){
  let last = -1;
  try { const raw = localStorage.getItem('sharpminds_q'); if(raw !== null) last = +raw; } catch(e){}
  let i;
  do { i = ri(0, QUOTES.length-1); } while(i === last && QUOTES.length > 1);
  try { localStorage.setItem('sharpminds_q', i); } catch(e){}
  return QUOTES[i];
}
const QUOTE = pickQuote();   // chosen once per visit

/* One handler for every "Leave this game" button */
view.addEventListener('click', e => { if(e.target.id === 'leave'){ save(); home(); } });

// One shared maximum level (MAX_LEVEL) for every game; fail loudly if any config goes past it.
console.assert(Object.values(LV).every(g => Object.values(g).flat().every(l => l>=1 && l<=MAX_LEVEL)) && Math.max(...Object.keys(SUDOKU_LEVELS), ...Object.keys(JIG)) <= MAX_LEVEL, 'A level is outside 1 to MAX_LEVEL');
$('#brand').onclick = landing;
$('#gear').onclick = () => SCREEN === 'settings' ? BACKTO() : settings();
$('#dash').onclick = landing;
applySettings();
landing();
